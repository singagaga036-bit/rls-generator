<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Генератор РЛС СССР / РФ</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='style.css'>
</head>
<body>
  <h1>📡 Генератор РЛС СССР / РФ</h1>
  <p class='sub'>Нажми кнопку — и получи случайную радиолокационную станцию с подробной справкой и ТТХ</p>
  <div class='scope' aria-hidden='true'>
    <div class='beam'></div>
    <svg class='radar-svg' id='radar' viewBox='0 0 100 100' preserveAspectRatio='none'></svg>
    <div class='dead-zone'></div>
    <span class='az az0'>0</span>
    <span class='az az90'>90</span>
    <span class='az az180'>180</span>
    <span class='az az270'>270</span>
  </div>
  <button id='genBtn'>Обнаружить и выдать</button>
  <div class='card' id='card' hidden>
    <i class='corner c1'></i><i class='corner c2'></i><i class='corner c3'></i><i class='corner c4'></i>
    <div class='chips'>
      <span class='chip chip-track' id='trackChip'></span>
      <span class='chip' id='year'></span>
      <span class='chip' id='nato' hidden></span>
    </div>
    <div class='name' id='name'></div>
    <div class='desc' id='desc'></div>
    <table class='ttx' id='ttx' hidden></table>
  </div>
  <div class='counter' id='counter'></div>
  <script src='data-ground.js'></script>
  <script src='data-heights-sam.js'></script>
  <script src='data-modern.js'></script>
  <script src='data-sprn.js'></script>
  <script src='data-navy.js'></script>
  <script src='data-air-fighters.js'></script>
  <script src='data-air-rest.js'></script>
  <script src='app.js'></script>
</body>
</html>
