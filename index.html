<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Генератор РЛС СССР / РФ</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap' rel='stylesheet'>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    background: radial-gradient(circle at 50% 20%, rgba(24, 74, 54, 0.5) 0%, rgba(4, 18, 12, 0) 60%), radial-gradient(circle at 50% 0%, #0a2118 0%, #04120c 55%, #020a07 100%);
    color: #cfeee1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 56px;
    overflow-x: hidden;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.028) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 50;
  }
  h1 { font-size: clamp(20px, 5vw, 28px); margin-bottom: 8px; text-align: center; letter-spacing: 0.04em; color: #eafff6; text-shadow: 0 0 18px rgba(46, 230, 168, 0.35); }
  .sub { color: #7fb8a2; margin-bottom: 28px; text-align: center; max-width: 520px; line-height: 1.6; font-size: 14px; }

  /* ===== Круговой индикатор (экран РМО) ===== */
  .scope {
    position: relative;
    width: min(86vw, 430px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: repeating-radial-gradient(circle at center, rgba(46, 230, 168, 0.13) 0 1px, transparent 1px 52px), radial-gradient(circle at center, rgba(46, 230, 168, 0.10) 0%, rgba(46, 230, 168, 0.02) 55%, transparent 75%);
    border: 1px solid rgba(46, 230, 168, 0.35);
    box-shadow: 0 0 0 6px rgba(2, 12, 8, 0.9), 0 0 0 7px rgba(46, 230, 168, 0.18), 0 0 60px rgba(46, 230, 168, 0.18), inset 0 0 60px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }
  .scope::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-conic-gradient(from 0deg at center, rgba(46, 230, 168, 0.15) 0 0.6deg, transparent 0.6deg 30deg);
    pointer-events: none;
  }
  .az { position: absolute; font-size: 11px; color: rgba(46, 230, 168, 0.55); letter-spacing: 0.1em; z-index: 5; }
  .az0 { top: 10px; left: 50%; transform: translateX(-50%); }
  .az90 { right: 12px; top: 50%; transform: translateY(-50%); }
  .az180 { bottom: 10px; left: 50%; transform: translateX(-50%); }
  .az270 { left: 12px; top: 50%; transform: translateY(-50%); }

  /* ===== Луч: просто белая палка из самого центра, без свечения ===== */
  .beam {
    position: absolute;
    left: calc(50% - 1px);
    top: 0;
    width: 2px;
    height: 50%;
    background: #ffffff;
    transform-origin: 50% 100%;
    will-change: transform;
    z-index: 4;
  }

  /* ===== Мёртвая воронка посередине (на 1/3 меньше) ===== */
  .dead-zone {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10.7%;
    height: 10.7%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #04120c;
    border: 1px solid rgba(46, 230, 168, 0.3);
    z-index: 3;
    pointer-events: none;
  }

  /* ===== Цели: сначала белые, после луча — жёлтые с трассой ===== */
  .radar-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .trail { fill: none; stroke: #ffd76e; stroke-width: 0.35; stroke-linejoin: round; stroke-linecap: round; opacity: 0.9; }
  .dot { fill: #ffd76e; }
  .course { stroke: #ffd76e; stroke-width: 0.3; opacity: 0.7; }
  .tnum { fill: #ffd76e; font-family: 'IBM Plex Mono', monospace; font-size: 2.8px; letter-spacing: 0.08em; opacity: 0.85; }
  .pending .dot { fill: #eafff6; }
  .pending .course { stroke: #eafff6; opacity: 0.55; }
  .pending .tnum { fill: #eafff6; opacity: 0.7; }

  /* ===== Кнопка ===== */
  button {
    font-family: inherit;
    margin-top: 28px;
    background: linear-gradient(180deg, #2b1708, #170b04);
    color: #ffc46b;
    border: 1px solid rgba(255, 180, 80, 0.55);
    border-radius: 12px;
    padding: 16px 32px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(255, 160, 60, 0.25), inset 0 1px 0 rgba(255, 200, 120, 0.25);
    transition: transform 0.1s, box-shadow 0.25s, border-color 0.25s;
  }
  button:hover { border-color: rgba(255, 200, 100, 0.9); box-shadow: 0 0 42px rgba(255, 170, 60, 0.5), inset 0 1px 0 rgba(255, 200, 120, 0.35); }
  button:active { transform: scale(0.97); }

  /* ===== Карточка цели ===== */
  .card {
    position: relative;
    margin-top: 26px;
    max-width: 560px;
    width: 100%;
    padding: 26px 24px 24px;
    background: rgba(6, 22, 16, 0.88);
    border: 1px solid rgba(46, 230, 168, 0.22);
    border-radius: 10px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(46, 230, 168, 0.05);
  }
  .card.reveal { animation: card-in 0.7s cubic-bezier(0.2, 0.8, 0.25, 1) both; }
  @keyframes card-in {
    0% { opacity: 0; transform: translateY(16px) scale(0.98); filter: brightness(2.4) saturate(0.4); }
    100% { opacity: 1; transform: none; filter: none; }
  }
  .corner { position: absolute; width: 16px; height: 16px; border: 2px solid #2ee6a8; }
  .c1 { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
  .c2 { top: -1px; right: -1px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .c3 { bottom: -1px; left: -1px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
  .c4 { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #7fd7c4; background: rgba(46, 230, 168, 0.08); border: 1px solid rgba(46, 230, 168, 0.25); border-radius: 999px; padding: 5px 12px; }
  .chip-track { color: #ffd76e; border-color: rgba(255, 215, 110, 0.35); background: rgba(255, 215, 110, 0.08); }
  .name { font-size: clamp(20px, 5vw, 26px); font-weight: 700; color: #ffd76e; margin-bottom: 12px; line-height: 1.3; }
  .desc { line-height: 1.7; font-size: 15px; }
  .counter { margin-top: 18px; color: #5c8a78; font-size: 13px; letter-spacing: 0.05em; }

  @media (prefers-reduced-motion: reduce) {
    .card.reveal { animation: none; }
  }
</style>
</head>
<body>
  <h1>📡 Генератор РЛС СССР / РФ</h1>
  <p class='sub'>Нажми кнопку — и получи случайную радиолокационную станцию с краткой справкой</p>
  <div class='scope' aria-hidden='true'>
    <div class='beam'></div>
    <svg class='radar-svg' id='radar' viewBox='0 0 100 100' preserveAspectRatio='none'></svg>
    <div class='dead-zone'></div>
    <span class='az az0'>0</span>
    <span class='az az90'>90</span>
    <span class='az az180'>180</span>
    <span class='az az270'>270</span>
  </div>
  <button id='genBtn'>Обнаружить и выдать</button>
  <div class='card' id='card' hidden>
    <i class='corner c1'></i><i class='corner c2'></i><i class='corner c3'></i><i class='corner c4'></i>
    <div class='chips'>
      <span class='chip chip-track' id='trackChip'></span>
      <span class='chip' id='year'></span>
    </div>
    <div class='name' id='name'></div>
    <div class='desc' id='desc'></div>
  </div>
  <div class='counter' id='counter'></div>
<script>
const stations = [
  { name: 'П-3 «Дамбо»', year: '1940-е', desc: 'Одна из первых советских послевоенных РЛС. Помогала наводить истребители на воздушные цели.' },
  { name: 'П-8 «Knife Rest A»', year: '1940-е', desc: 'РЛС раннего обнаружения. Открыла славную династию станций «П». В НАТО её прозвали «Нож-Отдых».' },
  { name: 'П-10 «Knife Rest B»', year: '1950-е', desc: 'Модернизация П-8. Дальше, надёжнее, с новой антенной.' },
  { name: 'П-12 «Енисей»', year: '1956', desc: 'Метровая РЛС обнаружения. Возили на двух грузовиках, антенна — большая решётка. Видела цели на 270 км и не боялась помех.' },
  { name: 'П-14 «Лена»', year: '1958', desc: 'Мощная метровая РЛС раннего оповещения. Антенна размером с дом, обзор — тысячи километров. Шпионы вычисляли её местоположение со спутников.' },
  { name: 'П-15 «Тропа»', year: '1955', desc: 'УКВ РЛС для ПВО. Компактная, на грузовике, с двумя антеннами-«корытами». Часто маскировали на вышках в лесу.' },
  { name: 'П-15М «Сопка»', year: '1962', desc: 'Модернизированная «Тропа». Работала и с колёс, и со стационарной вышки.' },
  { name: 'П-18 «Терек»', year: '1971', desc: 'Метровая мобильная РЛС. Хорошо видела самолёты, сделанные по «стелс»-технологиям.' },
  { name: 'П-19 «Роста»', year: '1974', desc: 'Дециметровая РЛС. Дежурная подружка зенитных комплексов: подсказывала им цели.' },
  { name: 'П-20 «Bar Lock»', year: '1950-е', desc: 'РЛС кругового обзора. Одна из рабочих лошадок ПВО пятидесятых.' },
  { name: 'П-30 «Big Mesh»', year: '1950-е', desc: 'Стационарная РЛС дальнего обнаружения. Ставилась на постоянные посты ПВО.' },
  { name: 'П-35 «Сатурн»', year: '1958', desc: 'РЛС кругового обзора на 300 км. Ставили и на прицепы, и на стационарные площадки.' },
  { name: 'П-37', year: '1960-е', desc: 'Модернизация «Сатурна». Антенна вращается быстрее, цель видно лучше.' },
  { name: 'П-40 «Long Track»', year: '1960-е', desc: 'РЛС наведения и целеуказания. Работала в паре с зенитными комплексами «Круг».' },
  { name: 'П-80 «Back Net»', year: '1960-е', desc: 'Мощная РЛС раннего оповещения с большой решётчатой антенной.' },
  { name: 'ПРВ-11 «Side Net»', year: '1950-е', desc: 'РЛС определения высоты. Дополняла обычные РЛС: те видели, где цель, а она — на какой высоте.' },
  { name: 'ПРВ-13 «Odd Pair»', year: '1960-е', desc: 'Улучшенный высотомер. Работал в паре со станциями обнаружения.' },
  { name: 'СНР-75 «Fan Song»', year: '1957', desc: 'Станция наведения ракет комплекса С-75. Именно этими комплексами в 1960 году сбили самолёт Пауэрса.' },
  { name: 'СНР-125 «Low Blow»', year: '1961', desc: 'Станция наведения для С-125 «Нева». Прославилась в войнах на Ближнем Востоке.' },
  { name: '1С91 «Straight Flush»', year: '1967', desc: 'РЛС зенитного комплекса «Куб». Ищет цель и тут же подсказывает её ракетам.' },
  { name: '30Н6 «Flap Lid»', year: '1978', desc: 'Многофункциональная РЛС С-300. Одновременно ищет, сопровождает и наводит ракеты.' },
  { name: '64Н6 «Big Bird»', year: '1980-е', desc: 'Большая РЛС обнаружения для С-300. Видит цели на сотни километров.' },
  { name: '76Н6 «Кластер Шелл»', year: '1983', desc: 'Низковысотный обнаружитель для С-300. Ищет крылатые ракеты у самой земли.' },
  { name: '96Л6Е «Cheese Board»', year: '1990-е', desc: 'Обнаружитель всех высот для С-300 и С-400. Видит и крылатые ракеты, и самолёты, и беспилотники.' },
  { name: '36Д6 «Тин Шилд»', year: '1982', desc: 'Подвижная 3D РЛС. Умеет измерять высоту целей, перевозится в контейнерах.' },
  { name: '64Л6 «Гамма-С1»', year: '1994', desc: 'Подвижная 3D РЛС. Задумана как дешёвая замена «Сатурна», разворачивается быстрее.' },
  { name: '1Л13 «Небо-СВ»', year: '1983', desc: 'Метровая РЛС для сухопутных войск. Ехала на гусеничном шасси вместе с армией.' },
  { name: '55Ж6 «Небо»', year: '1991', desc: 'Трёхкоординатная метровая РЛС дальнего обнаружения. Большая антенна на четырёх опорах.' },
  { name: '«Каста-2Е1»', year: '1980-е', desc: 'РЛС обнаружения низколетящих целей. В НАТО ей дали имя «Flat Face E».' },
  { name: '«Дуга»', year: '1976', desc: 'Загоризонтная РЛС слежения за стартами ракет. Пульсировала так, что радиолюбители всего мира прозвали её «Русский дятел».' },
  { name: '«Днестр»', year: '1964', desc: 'Одна из первых советских РЛС предупреждения о ракетном нападении. Видела старты ракет за океаном.' },
  { name: '«Днепр»', year: '1970-е', desc: 'Развитие «Днестра»: дальше, точнее, надёжнее. Дежурила в СССР, потом осталась в России и Беларуси.' },
  { name: '«Дарьял»', year: '1984', desc: 'Гигантская стационарная РЛС противоракетной обороны. Отдельные приёмная и передающая антенны высотой с небоскрёб. Стояла в Печоре и Габале.' },
  { name: '«Дунай-3У»', year: '1960-е', desc: 'РЛС системы противоракетной обороны Москвы (А-35). В НАТО её прозвали «Dog House».' },
  { name: '«Дон-2Н»', year: '1991', desc: 'РЛС обороны Москвы. Выглядит как огромная пирамида и смотрит во все стороны одновременно.' },
  { name: '«Волга»', year: '2000-е', desc: 'РЛС предупреждения о ракетном нападении. Дежурила в Беларуси и под Петербургом.' },
  { name: '«Воронеж»', year: '2010-е', desc: 'Семейство модульных РЛС («-ДМ», «-ВП», «-СМ»). Строится за 1–2 года вместо десяти лет.' },
  { name: '«Контейнер»', year: '2019', desc: 'Загоризонтная РЛС нового поколения. Ловит самолёты и ракеты за тысячи километров, отражая сигнал от ионосферы.' },
  { name: '«Ангара» МР-300 «Head Net»', year: '1960-е', desc: 'Корабельная РЛС обнаружения. Видела и воздух, и море. Стояла на крейсерах и эсминцах.' },
  { name: '«Восход» МР-600 «Top Sail»', year: '1960-е', desc: 'Корабельная РЛС большого радиуса. Ставилась на тяжёлые крейсера и авианосцы.' },
  { name: '«Фрегат» МР-710 «Top Steer»', year: '1970-е', desc: 'Корабельная 3D РЛС обнаружения. Стояла на крейсерах и больших противолодочных кораблях ВМФ.' },
  { name: '«Волна» 3Р41 «Top Dome»', year: '1970-е', desc: 'Корабельная станция подсветки и наведения для морского комплекса С-300F. Стояла на тяжёлых крейсерах.' },
  { name: '«Фурке» 5П-27', year: '2000-е', desc: 'Современная корабельная 3D РЛС. Ставится на новые корветы и фрегаты российского флота.' },
  { name: 'РУС-2', year: '1940-е', desc: 'Одна из первых советских наземных РЛС обнаружения. Работала в годы Великой Отечественной войны и помогала засекать самолёты противника.' },
  { name: '«Пегматит»', year: '1941', desc: 'Одна из первых стационарных РЛС ПВО СССР. Её создали прямо перед войной, и она дежурила, выглядывая самолёты на подлёте.' },
  { name: 'ПРВ-9', year: '1950-е', desc: 'Радиовысотомер сантиметрового диапазона. Измерял высоту целей на дальности до 300 км и работал в паре со станциями обнаружения.' },
  { name: 'ПРВ-16 «Надежность»', year: '1970-е', desc: 'Улучшенный высотомер на базе ПРВ-9. Работал в паре с дальномером П-40 и ездил на большом грузовике КрАЗ.' },
  { name: '9С15 «Обзор-3»', year: '1980-е', desc: 'Самоходная РЛС кругового обзора из состава С-300В. Искала цели по всему горизонту и подсказывала их ракетам. В НАТО — «Bill Board».' },
  { name: '9С19 «Имбирь»', year: '1980-е', desc: 'РЛС секторного обзора для С-300В. Специально обучена сопровождать баллистические ракеты: у неё неподвижная фазированная антенна.' },
  { name: '9С32', year: '1980-е', desc: 'Станция подсветки и наведения ракет комплекса С-300В. Работает как фонарик: подсвечивает цель, а ракета летит по отражённому сигналу.' },
  { name: '92Н6Е', year: '2010-е', desc: 'Многофункциональная РЛС С-400 «Триумф». Одновременно ищет цели, сопровождает их и наводит ракеты.' },
  { name: '48Я6-К1 «Подлёт-К1»', year: '2010-е', desc: 'Мобильная трёхкоординатная РЛС с фазированной решёткой кругового обзора. Специально выискивает низколетящие крылатые ракеты и беспилотники.' },
  { name: '«Противник-ГЕ»', year: '2000-е', desc: 'Универсальная мобильная трёхкоординатная РЛС пятого поколения. Видит цели до 340 км, определяет их высоту и разворачивается за 40 минут.' },
  { name: '«Резонанс-НЭ»', year: '2010-е', desc: 'Метровая РЛС дальнего обнаружения. Заточена под поиск малозаметных самолётов-«невидимок», стоит на вооружении нескольких стран.' },
  { name: '«Ниобий-СВ»', year: '2017', desc: 'Современная РЛС линейки «Ниобий» для сухопутных войск и ВКС. С 2017 года поступает в войска серийно.' },
  { name: '«Гамма-ДЕ»', year: '1990-е', desc: 'Большая трёхкоординатная РЛС дальнего действия. Умеет измерять высоту целей и работать в любую погоду.' },
  { name: '9С18 «Купол»', year: '1980-е', desc: 'Станция обнаружения и целеуказания зенитного комплекса «Бук». Подсказывала самоходным установкам, куда целить.' },
  { name: 'МР-123 «Вымпел»', year: '1970-е', desc: 'Корабельная РЛС управления огнём. Наводила корабельные пушки и ракеты, в НАТО её прозвали «Bass Tilt».' },
  { name: '«Позитив-М1.2»', year: '2000-е', desc: 'Корабельная трёхкоординатная РЛС Е-диапазона. Видит цели до 80 км и стоит на новых фрегатах типа «Адмирал Горшков».' },
  { name: '«Фрегат-М2ЭМ»', year: '2000-е', desc: 'Трёхкоординатная корабельная РЛС. Модернизация «Фрегата»: лучше видит цели и не боится помех.' },

let lastIndex = -1;
let shownCount = 0;
const el = id => document.getElementById(id);

function pad2(n) { return String(n).padStart(2, '0'); }

// ===== Цели на индикаторе =====
const NS = 'http://www.w3.org/2000/svg';
const svg = el('radar');
const targets = [];
let nextTrack = 0;
const DEAD_R = 5.3; // радиус мёртвой воронки (на 1/3 меньше прежнего)

function bearingOf(t) {
  return (Math.atan2(t.x - 50, 50 - t.y) * 180 / Math.PI + 360) % 360;
}

function draw(t) {
  t.dot.setAttribute('cx', t.x.toFixed(2));
  t.dot.setAttribute('cy', t.y.toFixed(2));
  const r = t.heading * Math.PI / 180;
  t.ray.setAttribute('x1', t.x.toFixed(2));
  t.ray.setAttribute('y1', t.y.toFixed(2));
  t.ray.setAttribute('x2', (t.x + Math.cos(r) * 5).toFixed(2));
  t.ray.setAttribute('y2', (t.y + Math.sin(r) * 5).toFixed(2));
  t.label.setAttribute('x', (t.x + 1.8).toFixed(2));
  t.label.setAttribute('y', (t.y - 1.5).toFixed(2));
  let pts = '';
  for (let i = 0; i < t.trail.length; i++) {
    pts += t.trail[i][0].toFixed(2) + ',' + t.trail[i][1].toFixed(2) + ' ';
  }
  pts += t.x.toFixed(2) + ',' + t.y.toFixed(2);
  t.poly.setAttribute('points', pts);
}

function addTarget() {
  nextTrack++;
  const num = pad2(((nextTrack - 1) % 50) + 1);
  // цель появляется в любой точке радара, но вне мёртвой воронки
  const ang = Math.random() * Math.PI * 2;
  const rad = DEAD_R + 2 + Math.random() * 37;
  const t = {
    x: 50 + rad * Math.cos(ang),
    y: 50 + rad * Math.sin(ang),
    heading: Math.random() * 360,
    speed: 1.6 + Math.random() * 1.4,
    trail: [],
    num: num,
    bearing: 0,
    coolUntil: 0,
    pending: true // белая, пока луч её не пройдёт
  };
  t.bearing = bearingOf(t);

  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'pending');
  const poly = document.createElementNS(NS, 'polyline');
  poly.setAttribute('class', 'trail');
  const ray = document.createElementNS(NS, 'line');
  ray.setAttribute('class', 'course');
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('class', 'dot');
  dot.setAttribute('r', '0.75');
  const label = document.createElementNS(NS, 'text');
  label.setAttribute('class', 'tnum');
  label.textContent = num;
  g.appendChild(poly);
  g.appendChild(ray);
  g.appendChild(dot);
  g.appendChild(label);
  svg.appendChild(g);

  t.g = g;
  t.poly = poly;
  t.ray = ray;
  t.dot = dot;
  t.label = label;
  targets.push(t);
  draw(t);

  while (targets.length > 12) {
    const old = targets.shift();
    old.g.parentNode.removeChild(old.g);
  }
  return num;
}

function step(t) {
  t.trail.push([t.x, t.y]);
  t.heading += (Math.random() - 0.5) * 26;
  const r = t.heading * Math.PI / 180;
  t.x += Math.cos(r) * t.speed;
  t.y += Math.sin(r) * t.speed;
  const dx = t.x - 50;
  const dy = t.y - 50;
  const d = Math.sqrt(dx * dx + dy * dy);
  if (d > 44) {
    t.heading = Math.atan2(-dy, -dx) * 180 / Math.PI + (Math.random() - 0.5) * 40;
  } else if (d < DEAD_R + 2) {
    // не залетать в мёртвую воронку
    t.heading = Math.atan2(dy, dx) * 180 / Math.PI + (Math.random() - 0.5) * 40;
  }
  t.bearing = bearingOf(t);
  draw(t);
}

// ===== Развёртка: белая палка-луч из центра, оборот за 10 секунд (6 об/мин) =====
const beamEl = document.querySelector('.beam');
const PERIOD = 10000;
const COOLDOWN = 8000;
let lastAngle = 0;
const t0 = performance.now();

function frame(now) {
  const angle = (((now - t0) % PERIOD) / PERIOD) * 360;
  beamEl.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';
  const delta = (angle - lastAngle + 360) % 360;
  if (delta > 0 && delta < 90) {
    for (let i = 0; i < targets.length; i++) {
      const t = targets[i];
      if (now < t.coolUntil) continue;
      const relPrev = (lastAngle - t.bearing + 360) % 360;
      if (relPrev <= delta) {
        if (t.pending) {
          t.pending = false;
          t.g.classList.remove('pending'); // луч прошёл — цель стала жёлтой
        }
        step(t);
        t.coolUntil = now + COOLDOWN;
      }
    }
  }
  lastAngle = angle;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function generate() {
  if (stations.length === 0) return;
  let i = Math.floor(Math.random() * stations.length);
  if (stations.length > 1) {
    while (i === lastIndex) {
      i = Math.floor(Math.random() * stations.length);
    }
  }
  lastIndex = i;
  shownCount++;
  const s = stations[i];
  el('name').textContent = s.name;
  el('year').textContent = 'Год создания: ' + s.year;
  el('desc').textContent = s.desc;
  const num = addTarget();
  el('trackChip').textContent = 'Трасса № ' + num;
  const card = el('card');
  card.hidden = false;
  card.classList.remove('reveal');
  void card.offsetWidth;
  card.classList.add('reveal');
  el('counter').textContent = 'В базе станций: ' + stations.length + ' · Показано: ' + shownCount + ' · На экране: ' + targets.length + ' / 12';
}

el('genBtn').addEventListener('click', generate);
el('counter').textContent = 'В базе станций: ' + stations.length;
</script>
